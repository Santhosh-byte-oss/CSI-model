<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edge AI Spatial Radar</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050510; font-family: 'Courier New', Courier, monospace; color: #00ff88; }
        #info { position: absolute; top: 20px; width: 100%; text-align: center; pointer-events: none; z-index: 10; }
        .data-box { background: rgba(0, 20, 10, 0.6); border: 1px solid #00ff88; display: inline-block; padding: 15px 30px; border-radius: 8px; box-shadow: 0 0 15px rgba(0, 255, 136, 0.2); backdrop-filter: blur(4px); }
        #status { font-size: 28px; font-weight: bold; color: #ff3366; margin-bottom: 8px; text-shadow: 0 0 10px rgba(255, 51, 102, 0.5); }
        #intensity, #rssi_val { font-size: 16px; color: #00ff88; margin-bottom: 5px; }
    </style>
    <!-- Core Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- GLTF Loader -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>
<body>
    <div id="info">
        <div class="data-box">
            <div style="font-size: 14px; margin-bottom:10px; letter-spacing: 2px;">CSI EDGE INFERENCE RADAR</div>
            <div id="status">WAITING FOR DATA...</div>
            <div id="intensity">MOTION INTENSITY: 0%</div>
            <div id="rssi_val">NODE 2 RSSI: N/A dBm</div>
        </div>
    </div>

    <script>
        // --- SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050510, 0.05);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 5, 15);
        camera.lookAt(0, 1, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.outputEncoding = THREE.sRGBEncoding;
        document.body.appendChild(renderer.domElement);

        const gridHelper = new THREE.GridHelper(30, 30, 0x00ff88, 0x003311);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);

        const hemiLight = new THREE.HemisphereLight(0x4433ff, 0x002244, 1.5);
        scene.add(hemiLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(5, 10, 5);
        scene.add(dirLight);

        // --- 3D MODEL LOADER ---
        let character = null;
        let mixer = null;
        let walkAction = null;
        const clock = new THREE.Clock();
        const loader = new THREE.GLTFLoader();

        loader.load('/static/avatar.glb', function (gltf) {
            character = gltf.scene;
            character.scale.set(0.012, 0.012, 0.012); 
            character.position.set(0, 0, 0);
            character.visible = false; 
            scene.add(character);

            mixer = new THREE.AnimationMixer(character);
            if (gltf.animations.length > 0) {
                walkAction = mixer.clipAction(gltf.animations[0]);
                walkAction.play(); 
                walkAction.paused = true; 
            }
            console.log("Avatar loaded successfully!");
        }, undefined, function (error) {
            console.error("Error loading /static/avatar.glb:", error);
        });

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);
            renderer.render(scene, camera);
        }
        animate();

        // --- SOCKET CONNECTION ---
        const socket = io();

        socket.on('csi_data', function(data) {
            const statusText = (data.status || "").toUpperCase();
            const intensity = data.intensity || 0;
            
            document.getElementById('intensity').innerText = `MOTION INTENSITY: ${intensity}%`;
            document.getElementById('rssi_val').innerText = `NODE 2 RSSI: ${data.node2_rssi} dBm`;
            
            const statusEl = document.getElementById('status');
            statusEl.innerText = statusText;

            // Direct mapping based on intensity and status
            if (intensity > 15 || statusText.includes('WALKING')) {
                statusEl.style.color = '#ff3366';
                statusEl.innerText = "WALKING";
                if (character) {
                    character.visible = true;
                    if (walkAction) walkAction.paused = false;
                }
            } 
            else if (statusText.includes('STANDING')) {
                statusEl.style.color = '#00ff88';
                if (character) {
                    character.visible = true;
                    if (walkAction) walkAction.paused = true;
                }
            } 
            else {
                statusEl.style.color = '#445566';
                statusEl.innerText = "NO HUMAN";
                if (character) {
                    character.visible = false;
                    if (walkAction) walkAction.paused = true;
                }
            }

            if (character) {
                character.position.x += (data.x_pos - character.position.x) * 0.1;
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
